# queue_stuck_after = "24h"
# # a qBittorrent torrent with zero progress for this long is flagged stalled
# qbit_stalled_after = "1h"
# # a completed download not imported into its *arr library after this long is flagged
# completed_not_imported_after = "30m"
# # how far back to look through *arr history when correlating events
# arr_history_window = "168h"
#
# # file extensions that should never appear in a finished download
# wrong_file_exts = [".exe", ".scr", ".bat", ".lnk", ".msi"]
