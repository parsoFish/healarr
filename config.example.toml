# healarr node configuration. Copy to /etc/healarr/config.toml (Pi) or
# /volume1/docker/healarr/config.toml (NAS). Secrets go in secrets.toml (0600).
node = "pi"                       # "pi" | "nas"

[services.sonarr]
url = "http://localhost:8989"
api_key_file = "/home/parso/.config/simplarr/sonarr/config.xml"   # or set sonarr_api_key in secrets.toml
[services.radarr]
url = "http://localhost:7878"
api_key_file = "/home/parso/.config/simplarr/radarr/config.xml"
[services.prowlarr]
url = "http://localhost:9696"
api_key_file = "/home/parso/.config/simplarr/prowlarr/config.xml"
[services.overseerr]
url = "http://localhost:5055"
[services.tautulli]
url = "http://localhost:8181"
[services.qbittorrent]
url = "http://192.0.2.10:8080"
[services.plex]
url = "https://192-0-2-10.<hash>.plex.direct:32400"   # Plex refuses plain HTTP from the LAN

[peer]
listen_addr = "0.0.0.0:8090"
peer_url = "http://192.0.2.10:8090"

[web]
listen_addr = "0.0.0.0:8091"
base_path = "/healarr"
# public_url = "http://192.0.2.10/healarr"   # LAN address for the digest email's "Decisions:" link; "" omits it

[email]
to = "you@example.com"
from = "healarr@example.com"
msmtp_path = "/usr/bin/msmtp"
digest_at = "07:00"                # local time-of-day the daily digest email is sent, "HH:MM"

[llm]
enabled = true
model = "claude-haiku-4-5-20251001"
daily_budget_usd = 1.0

[state]
db_path = "/var/lib/healarr/state.db"

[docker]
socket = "/var/run/docker.sock"
binary = "docker"

[[mounts]]
host = "/mnt/nas/tv"
container = "sonarr"
container_path = "/tv"
[[mounts]]
host = "/mnt/nas/downloads"
container = "sonarr"
container_path = "/downloads"
[[mounts]]
host = "/mnt/nas/movies"
container = "radarr"
container_path = "/movies"

# [agent]
# # IANA timezone name for daemon schedules (checkpoint_at, digest_at); ""
# # (default) uses the host's local timezone
# timezone = ""
# # how often the daemon writes its own heartbeat and checks its peer's
# heartbeat_interval = "5m"
# # local time-of-day the daily checkpoint run starts, "HH:MM"
# checkpoint_at = "03:00"
# # a peer whose last inbound *report* is older than this is shown as stale
# # in the digest; heartbeats never reset it (15m is 3 missed pushes at the
# # 5-minute check cycle the peer pushes from)
# peer_stale_after = "15m"
# # how long the peer_messages log is kept; the nightly checkpoint job
# # deletes anything older (default 30 days)
# peer_message_retention = "720h"

# [checks]
# # per-check timeout; a check that runs past this is reported as failed
# timeout = "60s"
#
# # filesystems to watch for disk pressure
# disk_paths = ["/volume1"]
# disk_warn_percent = 85
# disk_crit_percent = 92
#
# # a *arr queue item stuck in the same state this long is flagged
# queue_stuck_after = "24h"
# # a qBittorrent torrent still stalled or fetching metadata this long after
# # it was added is flagged (qBittorrent's own error states are flagged at once)
# qbit_stalled_after = "1h"
# # a completed download not imported into its *arr library after this long is flagged
# completed_not_imported_after = "30m"
# # how far back to look through *arr history when correlating events
# arr_history_window = "168h"
#
# # file extensions that should never appear in a finished download
# wrong_file_exts = [".exe", ".scr", ".bat", ".lnk", ".msi"]
# # qBittorrent categories (matched case-insensitively) where .iso is also
# # treated as a wrong file extension
# tv_categories = ["tv"]
# downloads_dirs = ["/volume1/downloads/tv", "/volume1/downloads/movies"]
#
# # an entry in a downloads dir that qBittorrent no longer tracks, and whose
# # mtime is older than this, is an orphan (*arr records are not consulted)
# orphan_after = "168h"
# recycle_dirs = ["/volume1/#recycle", "/volume1/downloads/#recycle"]
# recycle_warn_gb = 20
#
# # Docker reclaimable image size above which image bloat is flagged
# image_bloat_warn_gb = 2
#
# log_dirs = ["/var/log"]
# log_warn_gb = 1
#
# # a sudden jump in a *arr's "wanted" count above this percent (and this many
# # items) is flagged as a possible indexer or import failure
# wanted_spike_percent = 20
# wanted_spike_min = 10
# # window over which indexer failures are counted
# indexer_failure_window = "24h"
#
# # an Overseerr request in the "processing" state whose last update is older
# # than this is flagged
# overseerr_stuck_after = "168h"
# # a library is flagged stale when the newest file change under its path is
# # this much newer than Plex's last scan of that library
# plex_scan_stale_after = "2h"
# plex_libraries = [
#   { title = "TV Shows", path = "/volume1/tv" },
#   { title = "Movies", path = "/volume1/movies" },
# ]
#
# # a torrent that completed less than this long ago is exempt from the
# # safe-to-remove check, however far past its seeding target it is
# seeded_min_age = "24h"

# [staleness]
# # C6 point weights for the "is this title stale" scorer, plus the
# # thresholds and per-title state the decision workflow reads alongside
# # the score. A higher score means more stale.
# #
# # days-since-added-with-no-recent-watch component: full days_max_points
# # once days_since_added >= days_horizon, scaled linearly below that; a
# # title never watched and added more than never_watched_after_days ago
# # always gets the full days_max_points regardless of days_horizon
# days_max_points = 40
# days_horizon = 180
# never_watched_after_days = 30
#
# # watch-status points (a title fully watched is more stale than one still
# # being watched; ended shows are more stale than continuing ones)
# watched_full_points = 15
# watched_partial_points = -10
# ended_points = 10
# continuing_points = -15
#
# # disk-size points: size_points_per_gb per GB on disk, capped at size_max_points
# size_points_per_gb = 0.1
# size_max_points = 15
#
# # requester points: who asked for it matters (the owner's own requests are
# # less stale than someone else's)
# other_requester_points = 10
# owner_requester_points = -5
#
# # age-since-release points: age_points_per_day per day since release,
# # capped at age_max_points
# age_points_per_day = 0.05
# age_max_points = 10
#
# # a score >= candidate_threshold is a removal candidate; a score between
# # watchlist_threshold and candidate_threshold goes on the watchlist
# candidate_threshold = 70
# watchlist_threshold = 50
#
# # Overseerr username/email of the library owner; "" means unknown, so
# # every requester is scored as "other"
# owner = ""
# # once a title is snoozed it is excluded from staleness candidates for
# # this many days before it can resurface
# snooze_days = 60

# [cleanup]
# # dry_run reports what cleanup would remove without removing anything;
# # this must stay true until the operator has reviewed a few dry-run
# # reports and trusts the candidates it picks
# dry_run = true
# # an orphaned download must be at least this old before cleanup removes it
# orphan_min_age = "168h"
# # a file in a recycle bin dir must be at least this old before cleanup removes it
# recycle_min_age = "24h"
# # prune only dangling (untagged, unused) Docker images, never tagged ones
# docker_dangling = true

# [actions]
# # master switch for every mutating path (decision.Execute's delete
# # branch, cleanup.Execute, the NAS-side qbit_delete). Keep (snooze) is
# # never gated by this. This MUST stay false until the operator has
# # watched healarr's decisions long enough to trust them — flipping it to
# # true lets healarr delete files and torrents unattended.
# enabled = false
