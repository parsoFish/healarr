name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

jobs:
  lint-and-test:
    name: Lint + smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check healarr tests

      - name: Pytest smoke
        run: pytest -v

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t healarr:ci .

      - name: Verify CLI in container
        run: |
          # The image's ENTRYPOINT is `python -m healarr`, so passing
          # `--version` invokes the CLI's version command.
          docker run --rm healarr:ci --version
